# Jobs
Mi chiamo Claudio Stoduto, ma online molti mi conoscono come Mr. Claus.

Per anni ho raccontato storie attraverso i media digitali, tra podcasting, scrittura e progetti editoriali indipendenti. 
Oggi continuo a farlo in una forma diversa: più personale, più lenta, più consapevole.

Sono il fondatore di Chronodaddy, uno spazio nato dall’incontro tra due grandi passioni: l’orologeria e la paternità. Credo che gli orologi non siano soltanto strumenti per misurare il tempo, ma oggetti che custodiscono memoria, identità e passaggi di vita — proprio come accade quando si diventa genitori.

Questo sito raccoglie le esperienze e gli esperimenti.

Perché il tempo non si gestisce.

Si interpreta.